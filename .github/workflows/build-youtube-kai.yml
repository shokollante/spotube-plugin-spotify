name: Build YouTube By Kai

on:
  push:
    branches:
      - build-youtube-kai
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout YouTube By Kai source
        uses: actions/checkout@v4
        with:
          repository: Ka-iPy/spotube-plugin-youtube-audio
          ref: 6673ed237cfe0b48a19928785e6394e3cd11bbf3
          path: plugin

      - name: Patch broken plugin export
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('plugin/src/plugin.ht')
          s = p.read_text()
          s = s.replace('export { TemplateMetadataProviderPlugin }', 'export { YouTubeAudioSourcePlugin }')
          p.write_text(s)
          PY

      - name: Patch Hetu syntax while keeping playback fixes
        run: |
          cat > plugin/src/segments/audio_source.ht <<'EOF'
          import "module:spotube_plugin" as spotube_plugin
          import "module:std" as std

          var YouTubeEngine = spotube_plugin.YouTubeEngine

          class Converter {
            static fun toSpotubeMatchObject(res: List) -> List {
              return res.map((d){
                return {
                  "id": d["id"],
                  "title": d["title"],
                  "artists": [d["author"]],
                  "duration": d["duration"],
                  "thumbnail": "https://i.ytimg.com/vi/${d["id"]}/hqdefault.jpg",
                  "externalUri": "https://youtube.com/watch?v=${d["id"]}",
                }
              }).toList()
            }
          }

          class AudioSourceEndpoint {
            var yt: YouTubeEngine
            construct () {
              yt = YouTubeEngine()
            }

            get supportedPresets -> List {
              return [
                { type: "lossy", name: "mp4", qualities: [ { bitrate: 256000 }, { bitrate: 128000 }, { bitrate: 96000 }, { bitrate: 44000 } ] },
                { type: "lossy", name: "webm", qualities: [ { bitrate: 256000 }, { bitrate: 128000 }, { bitrate: 96000 }, { bitrate: 44000 } ] },
              ]
            }

            fun matches(track: Map) -> List {
              final artists = track["artists"].map((a)=> a["name"]).join(", ")
              final hasISRC = track["isrc"] != null && track["isrc"].isNotEmpty;
              return yt.search(
                hasISRC ? track["isrc"] : "${track["name"]} ${artists}"
              ).then((res){
                if(res.isEmpty && hasISRC) {
                  return yt.search(
                    "${track["name"]} ${artists}"
                  ).then((fallback){
                    return Converter.toSpotubeMatchObject(fallback)
                  })
                }
                return Converter.toSpotubeMatchObject(res)
              })
            }

            fun streams(match: Map) -> List {
              return yt.streamManifest(match["id"]).then((manifest){
                return manifest.map((stream){
                  return {
                    "url": stream["url"],
                    "container": stream["container"],
                    "type": "lossy",
                    "codec": "aac",
                    "bitrate": stream["bitrate"],
                  }
                }).toList()
              })
            }
          }

          export { AudioSourceEndpoint }
          EOF

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.2

      - name: Install Hetu build tools
        run: dart pub global activate hetu_script_dev_tools

      - name: Build plugin
        working-directory: plugin
        run: |
          mkdir -p build
          make
          make archive

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-by-kai-1.0.2-fixed
          path: plugin/build/plugin.smplug

      - name: Publish test release
        uses: ncipollo/release-action@v1
        with:
          tag: youtube-kai-1.0.2-fixed
          name: YouTube By Kai 1.0.2 Fixed
          body: Experimental Spotube YouTube audio-source build. Includes Kai playback changes plus the missing YouTubeAudioSourcePlugin export fix and lossy stream classification.
          allowUpdates: true
          replacesArtifacts: true
          artifacts: plugin/build/plugin.smplug
          token: ${{ secrets.GITHUB_TOKEN }}
